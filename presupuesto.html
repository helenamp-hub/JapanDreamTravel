<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presupuesto | Japan Dream Travel</title>

    <link rel="stylesheet" href="css/styles.css">

    <script defer src="js/main.js"></script>

    <script defer src="js/presupuesto.js"></script>

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    
        <header class="header">

            <div class="logo">
                Japan Dream Travel
            </div>

            <nav class="navbar">
    
                <a href="index.html" class="nav-link">Inicio</a>

                <a href="galeria.html" class="nav-link">Galería</a>

                <a href="presupuesto.html" class="nav-link">Presupuesto</a>

                <a href="contacto.html" class="nav-link">Contacto</a>

            </nav>

        </header>

        <section class="page-title">
            <section class="budget-section">

        <form id="budget-form">

            <!-- DATOS DE CONTACTO -->

            <div class="form-block">

                <h2>Datos de contacto</h2>

                <label>Nombre</label>
                    <input type="text" id="nombre">
                    <small class="error" id="error-nombre"></small>

                <label>Apellidos</label>
                    <input type="text" id="apellidos">
                    <small class="error" id="error-apellidos"></small>

                <label>Teléfono</label>
                    <input type="text" id="telefono">
                    <small class="error" id="error-telefono"></small>

                <label>Email</label>
                    <input type="email" id="email">
                    <small class="error" id="error-email"></small>

            </div>

            <!-- PRESUPUESTO -->

            <div class="form-block">

                <h2>Configura tu viaje</h2>

                <!-- PRODUCTO -->

                <label>Destino</label>

                <select id="producto">

                    <option value="1200">Tokyo Express - 1200€</option>

                    <option value="2200">Ruta Tradicional - 2200€</option>

                    <option value="3500">Japan Premium - 3500€</option>

                </select>

                <label>Días de viaje</label>

                <input type="number" id="plazo" min="1" value="7">

                <div class="extras">

                    <label>
                        <input type="checkbox" class="extra" value="300">
                        JR Pass (+300€)
                    </label>

                    <label>
                        <input type="checkbox" class="extra" value="200">
                        Seguro premium (+200€)
                    </label>

                    <label>
                        <input type="checkbox" class="extra" value="400">
                        Guía privado (+400€)
                    </label>

                </div>

                <div class="total-box">

                    <h3>
                        Presupuesto final:
                        <span id="total">0€</span>
                    </h3>

                </div>

            </div>

            <div class="conditions">

                <label>

                    <input type="checkbox" id="condiciones">
                    <small class="error" id="error-condiciones"></small>

                    Acepto las condiciones de privacidad

                </label>

            </div>

            <div class="buttons">

                <button type="submit">
                    Enviar
                </button>

                <button type="reset">
                    Resetear
                </button>

            </div>

        </form>

    </section>

            <h1>Solicita tu presupuesto</h1>

        </section>

        <footer class="footer">

        <div class="footer-content">

            <div class="footer-section">

                <h3>Síguenos</h3>

                <div class="social-icons">

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </a>

                    <a href="#" aria-label="Youtube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                    <a href="#" aria-label="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>

                </div>

            </div>

            <div class="footer-section">

                <h3>Dirección</h3>

                <p>
                    Japan Dream Travel<br>
                    Calle Sakura 24<br>
                    Tokio, Japón
                </p>

            </div>

            <div class="footer-section">

                <h3>Aviso Legal</h3>

                <p>
                    © 2026 Japan Dream Travel.<br>
                    Todos los derechos reservados.
                </p>

            </div>

        </div>

    </footer>

</body>

</html>
